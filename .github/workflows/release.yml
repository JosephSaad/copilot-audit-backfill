name: Release

on:
  push:
    tags:
      - 'v*'

# Read for every job; only publish, which creates the release, may write (2.4.12: before, every job's token
# could push, move tags and replace release assets, including the jobs that run downloaded code).
permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows only: the tool targets Windows Server x64.
        os: [windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Test-Engine
        shell: bash
        run: pwsh -NoProfile -File tests/Test-Engine.ps1
      - name: Test-Orchestrator
        shell: bash
        run: pwsh -NoProfile -File tests/Test-Orchestrator.ps1
      - name: Test-UserDirectory
        shell: bash
        run: pwsh -NoProfile -File tests/Test-UserDirectory.ps1
      - name: Test-DataHealth
        shell: bash
        run: pwsh -NoProfile -File tests/Test-DataHealth.ps1
      - name: Test-Precache
        shell: bash
        run: pwsh -NoProfile -File tests/Test-Precache.ps1
      - name: Test-Provisioning
        shell: bash
        run: pwsh -NoProfile -File tests/Test-Provisioning.ps1
      - name: Test-ExternalUsage
        shell: bash
        run: pwsh -NoProfile -File tests/Test-ExternalUsage.ps1
      - name: Test-DropGuard
        shell: bash
        run: pwsh -NoProfile -File tests/Test-DropGuard.ps1
      - name: Test-SchemaCompatibility
        shell: bash
        run: pwsh -NoProfile -File tests/Test-SchemaCompatibility.ps1
      - name: Test-OperationsGuide
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-OperationsGuide.ps1
      - name: Test-Spelling
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-Spelling.ps1
      - name: Test-SqlScriptOrder
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-SqlScriptOrder.ps1
      - name: Test-PowerBiModel
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-PowerBiModel.ps1
      - name: Test-Workflows
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-Workflows.ps1
      - name: Test-CsvImport
        shell: bash
        run: pwsh -NoProfile -File tests/Test-CsvImport.ps1
      - name: Test-NightlyProfile
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-NightlyProfile.ps1
      - name: Test-ReportingReference
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-ReportingReference.ps1

  sql-integration:
    # See ci.yml: Linux only because service containers require a Linux runner.
    name: SQL Server integration
    runs-on: ubuntu-latest
    services:
      sqlserver:
        # 2022-latest as of 3 October 2026, by digest: a tag can be moved.
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ format('Ci-{0}-Qz9', github.run_id) }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    env:
      SQLIT_SERVER: 127.0.0.1,1433
      SQLIT_USER: sa
      SQLIT_PASSWORD: ${{ format('Ci-{0}-Qz9', github.run_id) }}
      SQLIT_DATABASE: CopilotAuditIntegration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for its release tags: the test installs over an earlier release (section 20).
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if not s.connect_ex(('127.0.0.1',1433)) else 1)"; then
              echo "port 1433 open after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "SQL Server never opened port 1433" >&2
          exit 1
      - name: Test-SqlIntegration
        shell: bash
        run: pwsh -NoProfile -File tests/Test-SqlIntegration.ps1

  analyze:
    # The same analysis as ci.yml's (2.4.12: the release ran without it). The analyzer is saved at a fixed
    # version and its signatures checked before it is loaded, as tools/Save-CopilotAuditModules.ps1 checks the modules it saves.
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'analyzer'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          foreach ($try in 1..3) {
              try { Save-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Path $dir -Repository PSGallery -Force -ErrorAction Stop; break }
              catch { if ($try -eq 3) { throw }; Write-Host "Try $try failed: $($_.Exception.Message)"; Start-Sleep 20 }
          }
          . ./tools/Save-CopilotAuditModules.ps1
          $unsigned = @(Get-UnsignedModuleFile -Path $dir)
          if ($unsigned.Count) { $unsigned | Format-Table -AutoSize | Out-String -Width 300; throw "$($unsigned.Count) file(s) of PSScriptAnalyzer are not signed by their publisher." }
          Import-Module (Join-Path $dir 'PSScriptAnalyzer' '1.25.0' 'PSScriptAnalyzer.psd1') -Force

          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File |
                   Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          Write-Host "Analyzing $($files.Count) file(s)."
          $results = @()
          foreach ($f in $files) {
              $results += Invoke-ScriptAnalyzer -Path $f.FullName -Settings ./PSScriptAnalyzerSettings.psd1
          }
          # Warnings fail the release too, as in ci.yml.
          $found = @($results | Where-Object { $_.Severity -in 'Error', 'Warning' })
          if ($found.Count) {
              $found | ForEach-Object {
                  Write-Host ("::error file={0},line={1}::{2}: {3}" -f `
                      (Resolve-Path -Relative $_.ScriptPath), $_.Line, $_.RuleName, $_.Message)
              }
              throw "PSScriptAnalyzer reported $($found.Count) finding(s)."
          }
          Write-Host "No findings."

  dashboard:
    name: Copilot Insights dashboard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test
        shell: pwsh
        run: dotnet test dashboard/CopilotInsights.Tests/CopilotInsights.Tests.csproj -c Release --nologo
      - name: Publish the site
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Framework-dependent: the server's ASP.NET Core 10 Hosting Bundle supplies the runtime.
          $name = "copilot-insights-$env:GITHUB_REF_NAME"
          dotnet publish dashboard/CopilotInsights/CopilotInsights.csproj -c Release -o "publish/CopilotInsights" --nologo
          if (-not (Test-Path publish/CopilotInsights/CopilotInsights.dll)) { throw 'publish produced no CopilotInsights.dll' }
          Compress-Archive -Path publish/CopilotInsights -DestinationPath "$name.zip" -CompressionLevel Optimal
          Get-Item "$name.zip" | Select-Object Name, Length
      - name: Upload the site for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-site
          path: copilot-insights-*.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [test, sql-integration, analyze, dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the dashboard site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-site
          path: dist

      - name: Build the archive
        id: build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NAME="copilot-audit-backfill-${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

          # Everything the tool needs, minus CI plumbing and git metadata.
          STAGE="$(mktemp -d)/${NAME}"
          mkdir -p "$STAGE"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.gitignore' \
                --exclude='dist/' --exclude='*.zip' --exclude='*.sha256' --exclude='bin/' --exclude='obj/' ./ "$STAGE/"

          # Deterministic ordering so the checksum is reproducible from a
          # given tree, and a flat archive rooted at the version folder.
          ( cd "$(dirname "$STAGE")" && find "${NAME}" -print0 | sort -z | \
              xargs -0 zip -X -q "${GITHUB_WORKSPACE}/${NAME}.zip" )

          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"

          # 2.6.5: no offline zip of bundled PowerShell modules. The modules the scripts need come from the
          # PowerShell Gallery, or a feed that mirrors it (tools/Save-CopilotAuditModules.ps1 saves them).

          # The published dashboard, ready for dashboard/Install-CopilotInsights.ps1 -PackagePath.
          SITE="copilot-insights-${VERSION}"
          if [ ! -f "dist/${SITE}.zip" ]; then
            echo "The dashboard package dist/${SITE}.zip is missing" >&2
            exit 1
          fi
          mv "dist/${SITE}.zip" .
          sha256sum "${SITE}.zip" > "${SITE}.zip.sha256"
          echo "site=${SITE}" >> "$GITHUB_OUTPUT"

          echo "--- archive ---"
          unzip -l "${NAME}.zip"
          echo "--- checksums ---"
          cat "${NAME}.zip.sha256" "${SITE}.zip.sha256"

      # This proves only that nothing changed between two steps of this job. Where the files came
      # from rests on the pinned actions and the read-only tokens.
      - name: Read the archives back against their checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${{ steps.build.outputs.name }}.zip.sha256"
          sha256sum -c "${{ steps.build.outputs.site }}.zip.sha256"

      - name: Extract the changelog entry
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.build.outputs.version }}"
          # The section for this tag: from its own heading to the next one.
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No CHANGELOG entry found for ${VERSION}" >&2
            exit 1
          fi
          echo "--- release notes ---"
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.build.outputs.name }}"
          SITE="${{ steps.build.outputs.site }}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${NAME}.zip" \
            "${NAME}.zip.sha256" \
            "${SITE}.zip" \
            "${SITE}.zip.sha256"
