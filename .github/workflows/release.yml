name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test-Engine
        shell: bash
        run: pwsh -NoProfile -File tests/Test-Engine.ps1
      - name: Test-Orchestrator
        shell: bash
        run: pwsh -NoProfile -File tests/Test-Orchestrator.ps1

  sql-integration:
    name: SQL Server integration
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ format('Ci-{0}-Qz9', github.run_id) }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    env:
      SQLIT_SERVER: 127.0.0.1,1433
      SQLIT_USER: sa
      SQLIT_PASSWORD: ${{ format('Ci-{0}-Qz9', github.run_id) }}
      SQLIT_DATABASE: CopilotAuditIntegration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if not s.connect_ex(('127.0.0.1',1433)) else 1)"; then
              echo "port 1433 open after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "SQL Server never opened port 1433" >&2
          exit 1
      - name: Test-SqlIntegration
        shell: bash
        run: pwsh -NoProfile -File tests/Test-SqlIntegration.ps1


  bundle:
    name: Offline module bundle (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the tool and save the modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name  = "copilot-audit-backfill-$env:GITHUB_REF_NAME-offline-win-x64"
          $stage = Join-Path 'offline' $name
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # Everything the operator needs, minus CI plumbing.
          Get-ChildItem -Path . -Force |
            Where-Object { $_.Name -notin '.git', '.github', '.gitignore', 'offline' } |
            Copy-Item -Destination $stage -Recurse -Force

          # The same script that ships in tools/, so the release exercises the
          # documented path rather than a CI-only copy of it. It verifies the
          # saved module resolves from the bundle alone and writes a manifest.
          ./tools/Save-CopilotAuditModules.ps1 -Path $stage -Force

          $psd1 = Get-ChildItem -Path (Join-Path $stage 'Modules') -Recurse -Filter 'Microsoft.Graph.Authentication.psd1' |
                  Select-Object -First 1
          $ver = if ($psd1) { (Import-PowerShellDataFile -LiteralPath $psd1.FullName).ModuleVersion } else { 'unknown' }

          # Built line by line: a PowerShell here-string would have to start at
          # column 0, which ends the YAML block scalar this step lives in.
          $notice = @(
            'This archive bundles a third-party PowerShell module so the tool can run on a'
            'server with no PowerShell Gallery access.'
            ''
            "  Microsoft.Graph.Authentication $ver"
            '  Publisher : Microsoft'
            '  Copyright : (c) Microsoft Corporation. All rights reserved.'
            '  Source    : https://www.powershellgallery.com/packages/Microsoft.Graph.Authentication'
            '  Project   : https://github.com/microsoftgraph/msgraph-sdk-powershell'
            '  Licence   : https://aka.ms/devservicesagreement'
            ''
            'It is redistributed here only so the tool can be installed on a disconnected'
            "server. Microsoft's licence terms govern that module; this project's MIT"
            'LICENSE covers only the files outside the Modules folder.'
            'Modules/MODULES-MANIFEST.csv lists a SHA-256 for every bundled file.'
            ''
            'To build this bundle yourself instead of trusting this archive, run'
            'tools/Save-CopilotAuditModules.ps1 on any machine with gallery access.'
          ) -join [Environment]::NewLine
          Set-Content -Path (Join-Path $stage 'NOTICE-BUNDLED-MODULES.txt') -Value $notice -Encoding UTF8

          Compress-Archive -Path $stage -DestinationPath "$name.zip" -CompressionLevel Optimal
          Get-Item "$name.zip" | Select-Object Name, Length

      - name: Upload the bundle for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: copilot-audit-backfill-*-offline-win-x64.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [test, sql-integration, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the offline bundle
        uses: actions/download-artifact@v4
        with:
          name: offline-bundle
          path: dist

      - name: Build the archive
        id: build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NAME="copilot-audit-backfill-${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

          # Everything the tool needs, minus CI plumbing and git metadata.
          STAGE="$(mktemp -d)/${NAME}"
          mkdir -p "$STAGE"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.gitignore' \
                --exclude='dist/' --exclude='*.zip' --exclude='*.sha256' ./ "$STAGE/"

          # Deterministic ordering so the checksum is reproducible from a
          # given tree, and a flat archive rooted at the version folder.
          ( cd "$(dirname "$STAGE")" && find "${NAME}" -print0 | sort -z | \
              xargs -0 zip -X -q "${GITHUB_WORKSPACE}/${NAME}.zip" )

          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"

          # The offline bundle was built on windows-latest and came down as an
          # artifact; checksum it here so both files are hashed the same way.
          OFFLINE="${NAME}-offline-win-x64"
          if [ ! -f "dist/${OFFLINE}.zip" ]; then
            echo "The offline bundle dist/${OFFLINE}.zip is missing" >&2
            ls -la dist || true
            exit 1
          fi
          mv "dist/${OFFLINE}.zip" .
          sha256sum "${OFFLINE}.zip" > "${OFFLINE}.zip.sha256"
          echo "offline=${OFFLINE}" >> "$GITHUB_OUTPUT"

          echo "--- archive ---"
          unzip -l "${NAME}.zip"
          echo "--- offline bundle ---"
          unzip -l "${OFFLINE}.zip" | tail -5
          du -h "${OFFLINE}.zip"
          echo "--- checksums ---"
          cat "${NAME}.zip.sha256" "${OFFLINE}.zip.sha256"

      - name: Verify the checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${{ steps.build.outputs.name }}.zip.sha256"
          sha256sum -c "${{ steps.build.outputs.offline }}.zip.sha256"

      - name: Extract the changelog entry
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.build.outputs.version }}"
          # The section for this tag: from its own heading to the next one.
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No CHANGELOG entry found for ${VERSION}" >&2
            exit 1
          fi
          echo "--- release notes ---"
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.build.outputs.name }}"
          OFFLINE="${{ steps.build.outputs.offline }}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${NAME}.zip" \
            "${NAME}.zip.sha256" \
            "${OFFLINE}.zip" \
            "${OFFLINE}.zip.sha256"
