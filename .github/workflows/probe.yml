name: Probe (temporary)

on:
  workflow_dispatch:
  push:
    branches: [perf/flatten-single-parse]
    paths: ['.github/workflows/probe.yml', 'tools/probe.sql']

jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ format('Ci-{0}-Qz9', github.run_id) }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if not s.connect_ex(('127.0.0.1',1433)) else 1)"; then
              echo "port open after ${i}"; exit 0; fi
            sleep 3
          done
          exit 1
      - name: Run the probe
        shell: pwsh
        env:
          SAPW: ${{ format('Ci-{0}-Qz9', github.run_id) }}
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 20
          $cs = "Data Source=127.0.0.1,1433;Initial Catalog=master;User ID=sa;Password=$env:SAPW;Encrypt=True;TrustServerCertificate=True"
          $conn = [System.Data.SqlClient.SqlConnection]::new($cs)
          $conn.Open()
          $cmd = $conn.CreateCommand()
          $cmd.CommandText = Get-Content -Raw tools/probe.sql
          $cmd.CommandTimeout = 300
          $r = $cmd.ExecuteReader()
          while ($r.Read()) { "{0,-58} {1}" -f $r.GetString(0), $r.GetString(1) }
          $r.Close(); $conn.Close()
