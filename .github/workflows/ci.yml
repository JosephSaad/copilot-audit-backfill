name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows only: the tool targets Windows Server x64.
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up PowerShell 7.4
        shell: bash
        run: |
          set -euo pipefail
          # The runners ship PowerShell 7, but pin 7.4 so the matrix is honest
          # about what it tested.
          if pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' | grep -q '^7\.4\.'; then
            echo "PowerShell 7.4 already present: $(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
          else
            dotnet tool install --global PowerShell --version 7.4.* || dotnet tool update --global PowerShell --version 7.4.*
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          fi

      - name: Report versions
        shell: bash
        run: |
          pwsh -NoProfile -Command '$PSVersionTable | Format-List'
          python3 --version

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Test-Engine
        shell: bash
        run: pwsh -NoProfile -File tests/Test-Engine.ps1

      - name: Test-Orchestrator
        shell: bash
        run: pwsh -NoProfile -File tests/Test-Orchestrator.ps1
      - name: Test-UserDirectory
        shell: bash
        run: pwsh -NoProfile -File tests/Test-UserDirectory.ps1
      - name: Test-Provisioning
        shell: bash
        run: pwsh -NoProfile -File tests/Test-Provisioning.ps1
      - name: Test-OperationsGuide
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-OperationsGuide.ps1
      - name: Test-Spelling
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-Spelling.ps1
      - name: Test-SqlScriptOrder
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-SqlScriptOrder.ps1
      - name: Test-PowerBiModel
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-PowerBiModel.ps1
      - name: Test-Workflows
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-Workflows.ps1
      - name: Test-CsvImport
        shell: bash
        run: pwsh -NoProfile -File tests/Test-CsvImport.ps1

  dashboard:
    name: Copilot Insights dashboard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        shell: pwsh
        run: dotnet test dashboard/CopilotInsights.Tests/CopilotInsights.Tests.csproj -c Release --nologo

      - name: Publish (what the IIS installer takes)
        shell: pwsh
        run: dotnet publish dashboard/CopilotInsights/CopilotInsights.csproj -c Release -o out/CopilotInsights --nologo

  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        # The PowerShell Gallery sometimes answers "no match" for a moment: three tries, 20 seconds apart.
        run: |
          foreach ($try in 1..3) {
              try { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop; break }
              catch { if ($try -eq 3) { throw }; Write-Host "Try $try failed: $($_.Exception.Message)"; Start-Sleep 20 }
          }

      - name: Analyze
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File |
                   Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          Write-Host "Analyzing $($files.Count) file(s)."
          $results = @()
          foreach ($f in $files) {
              $results += Invoke-ScriptAnalyzer -Path $f.FullName -Settings ./PSScriptAnalyzerSettings.psd1
          }

          $errors   = @($results | Where-Object Severity -eq 'Error')
          $warnings = @($results | Where-Object Severity -eq 'Warning')

          if ($warnings.Count) {
              Write-Host "::group::$($warnings.Count) warning(s)"
              $warnings | ForEach-Object {
                  Write-Host ("::warning file={0},line={1}::{2}: {3}" -f `
                      (Resolve-Path -Relative $_.ScriptPath), $_.Line, $_.RuleName, $_.Message)
              }
              Write-Host '::endgroup::'
          }

          # Warnings fail the build too: a rule that does not fit is excluded in PSScriptAnalyzerSettings.psd1, with its reason.
          $errors = @($errors) + @($warnings)
          if ($errors.Count) {
              $errors | ForEach-Object {
                  Write-Host ("::error file={0},line={1}::{2}: {3}" -f `
                      (Resolve-Path -Relative $_.ScriptPath), $_.Line, $_.RuleName, $_.Message)
              }
              throw "PSScriptAnalyzer reported $($errors.Count) finding(s)."
          }

          Write-Host "No findings."

  sql-integration:
    # ubuntu-latest is the one exception to Windows-only: GitHub service
    # containers run on Linux runners only, and this job needs one to host
    # SQL Server. What it exercises - the engine's SqlBulkCopy path and the
    # SQL scripts - is the same either way; the runner is only the client.
    name: SQL Server integration
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ format('Ci-{0}-Qz9', github.run_id) }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433

    env:
      SQLIT_SERVER: 127.0.0.1,1433
      SQLIT_USER: sa
      SQLIT_PASSWORD: ${{ format('Ci-{0}-Qz9', github.run_id) }}
      SQLIT_DATABASE: CopilotAuditIntegration

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          # The service container reports healthy before SQL Server accepts
          # logins. The test waits too; failing here just gives a clearer message.
          for i in $(seq 1 60); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if not s.connect_ex(('127.0.0.1',1433)) else 1)"; then
              echo "port 1433 open after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "SQL Server never opened port 1433" >&2
          docker ps -a
          exit 1

      - name: Test-SqlIntegration
        shell: bash
        run: pwsh -NoProfile -File tests/Test-SqlIntegration.ps1
