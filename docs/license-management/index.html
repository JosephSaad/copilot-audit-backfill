<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>License Management walkthrough</title>
<style>
:root {
  --bg: #f4f6fb; --panel: #ffffff; --ink: #0f172a; --muted: #5b6475; --line: #e3e7ef;
  --accent: #2563eb; --accent-soft: #e8efff; --sub-bg: rgba(15,23,42,.86); --sub-ink: #ffffff;
  --s1: #0e7490; --s2: #7c3aed; --s3: #b45309; --s4: #15803d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1020; --panel: #121a2e; --ink: #e8ecf5; --muted: #9aa4b8; --line: #243049;
    --accent: #6ea0ff; --accent-soft: #1b2a4a; --sub-bg: rgba(0,0,0,.82);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 18px; margin: 0; font-weight: 650; }
header .sub { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
.layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 58px); }
nav { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; max-height: calc(100vh - 58px); padding: 8px 0 24px; }
nav h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 18px 6px; }
nav button { all: unset; display: grid; grid-template-columns: 26px 1fr; gap: 8px; width: calc(100% - 16px); margin: 0 8px; padding: 8px 10px;
  border-radius: 8px; cursor: pointer; box-sizing: border-box; }
nav button:hover { background: var(--accent-soft); }
nav button[aria-current="true"] { background: var(--accent-soft); outline: 2px solid var(--accent); }
nav .num { font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; }
nav .t { font-size: 13.5px; }
nav .who { display: block; font-size: 12px; color: var(--muted); }
main { padding: 20px 28px 28px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: #fff; }
.role { background: var(--panel); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.meta h2 { margin: 0; font-size: 20px; font-weight: 650; flex-basis: 100%; }
.stage { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #000; box-shadow: 0 8px 30px rgba(15,23,42,.12); }
.stage img { display: block; width: 100%; height: auto; }
.subtitle { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(88%, 980px); text-align: center;
  background: var(--sub-bg); color: var(--sub-ink); padding: 10px 18px; border-radius: 10px; font-size: 19px; line-height: 1.4; min-height: 1em; }
.subtitle:empty { display: none; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.controls button, .controls select { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.controls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 96px; }
.controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.bar { flex: 1; min-width: 160px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
.counter { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details p { margin: 8px 0 0; }
.keys { color: var(--muted); font-size: 12px; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  nav { max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 14px 16px; }
  .subtitle { position: static; transform: none; width: auto; border-radius: 0; font-size: 16px; }
}
</style>
</head>
<body>
<header>
  <div><h1>License Management walkthrough</h1><div class="sub">Copilot Governance Workbench · Copilot seat licenses reserved per LOB · demo data</div></div>
  <div class="spacer"></div>
  <span class="counter" id="total"></span>
</header>
<div class="layout">
  <nav id="nav" aria-label="Steps"></nav>
  <main>
    <div class="meta"><span class="chip" id="section"></span><span class="chip role" id="role"></span><h2 id="title"></h2></div>
    <div class="stage"><img id="shot" alt=""><div class="subtitle" id="subtitle" aria-live="polite"></div></div>
    <div class="controls">
      <button id="prev" title="Previous step (Left arrow)">Previous</button>
      <button id="play" class="primary" title="Play or pause (Space)">Play</button>
      <button id="next" title="Next step (Right arrow)">Next</button>
      <div class="bar" aria-hidden="true"><div id="progress"></div></div>
      <span class="counter" id="counter"></span>
      <label><input type="checkbox" id="auto" checked> Continue to next step</label>
      <label><input type="checkbox" id="subs" checked> Subtitles</label>
      <label>Speed <select id="speed"><option>0.9</option><option selected>1</option><option>1.15</option><option>1.3</option></select></label>
    </div>
    <details><summary>Full narration for this step</summary><p id="narration"></p></details>
    <div class="keys">Keys: Space play or pause · Left and Right arrows previous and next step · S subtitles on or off</div>
    <audio id="audio" preload="auto"></audio>
  </main>
</div>
<script>
const SCENES = [{"n": 1, "file": "01-seat-read.png", "section": "1. Prerequisites", "persona": "Kevin Brooks", "role": "Platform operator", "title": "Check the seat read-back is connected", "narration": "Before anyone uses License Management, three things are set up outside the Workbench. First, the Worker app gets two read-only Microsoft Graph permissions, LicenseAssignment dot Read dot All and Reports dot Read dot All, and an Entra administrator grants admin consent. Second, user names are shown in Microsoft 365 usage reports, so unused seats can be matched to people. Third, the license group and the fourteen LOB tracking groups exist in AD, provisioned by OIM roles and synced to Entra. The platform operator then checks the Copilot seats read on Operations, Sync, and can run it on demand.", "url": "/Operations/Sync", "audio": "audio/01.wav", "durationMs": 41970}, {"n": 2, "file": "02-seat-groups.png", "section": "2. Admin configuration", "persona": "Leo Fischer", "role": "Workbench administrator", "title": "Map the license group and the LOB tracking groups", "narration": "The Workbench administrator opens Admin, Seat groups. Each group has a purpose. GSGu MCO Copilot M365 is the shared license group. Each GSGu MCO Tracking group is tied to one LOB and to its OIM role. The read-back shows whether each group was found in Entra, whether it is synced from AD, and how many members it has.", "url": "/Admin/SeatGroups", "audio": "audio/02.wav", "durationMs": 24670}, {"n": 3, "file": "03-confirm-purpose.png", "section": "2. Admin configuration", "persona": "Leo Fischer", "role": "Workbench administrator", "title": "Confirm what the other MCO groups are for", "narration": "Groups whose purpose is not confirmed yet, such as the exclusion and Chat-only groups, raise no findings. Once their owner confirms what a group does, the administrator ticks Purpose confirmed. From then on, anyone holding a seat while in a confirmed exclusion group is flagged.", "url": "/Admin/SeatGroups?edit=55743dda-c8d3-f111-a0e5-6045bd5e8510#group-form", "audio": "audio/03.wav", "durationMs": 18985}, {"n": 4, "file": "04-skus-settings.png", "section": "2. Admin configuration", "persona": "Leo Fischer", "role": "Workbench administrator", "title": "Check the Copilot SKUs and the seat settings", "narration": "Below the groups are the Copilot SKUs. The add-on is counted as a seat. A suite that already includes Copilot, such as E7, is marked so that anyone holding both is flagged as paid twice. The seat settings follow the reservation policy: the EA anniversary on the first of April, the forty-five day true-down window, the operational buffer, one seat rate for every LOB, and sixty days without Copilot use before a seat is proposed for reclaim.", "url": "/Admin/SeatGroups", "audio": "audio/04.wav", "durationMs": 30775}, {"n": 5, "file": "05-baseline-form.png", "section": "2. Admin configuration", "persona": "Carlos Mendes", "role": "FinOps lead (Finance)", "title": "Record each LOB's first reservation", "narration": "For an LOB that has no reservation yet, the FinOps lead records the first one, here fifteen seats for BSAM, from the agreed reservation schedule. This is allowed once per LOB. Every later change goes through a reservation change request, so it has an approver and a record.", "url": "/Registry/Seats/4f743dda-c8d3-f111-a0e5-6045bd5e8510", "audio": "audio/05.wav", "durationMs": 19090}, {"n": 6, "file": "06-first-admin.png", "section": "3. Assignments", "persona": "Dev Duarte", "role": "BSAM business owner", "title": "The business owner names the LOB's first seat admin", "narration": "Assignments start with the LOB. The BSAM business owner, or the Platform Owner, names the first LOB seat admin. The role is scoped to one LOB. It can see that LOB's seats, ask for reservation changes and name other seat admins, but it approves nothing.", "url": "/Registry/Seats/4f743dda-c8d3-f111-a0e5-6045bd5e8510#admins", "audio": "audio/06.wav", "durationMs": 18575}, {"n": 7, "file": "07-more-admins.png", "section": "3. Assignments", "persona": "Farid Ferreira", "role": "BSAM seat admin", "title": "Seat admins name other seat admins for their own LOB", "narration": "The new seat admin can add more seat admins, but only for BSAM and only this role. Nobody can name themselves, and the last seat admin cannot remove themselves. Every assignment records who made it, and is audited.", "url": "/Registry/Seats/4f743dda-c8d3-f111-a0e5-6045bd5e8510#admins", "audio": "audio/07.wav", "durationMs": 15170}, {"n": 8, "file": "08-own-lob-only.png", "section": "3. Assignments", "persona": "Farid Ferreira", "role": "BSAM seat admin", "title": "Each seat admin sees only their own LOB", "narration": "On Registry, Copilot seats, a seat admin sees only the LOBs they administer. Row-level security in the database keeps the other thirteen LOBs out of view.", "url": "/Registry/Seats", "audio": "audio/08.wav", "durationMs": 11005}, {"n": 9, "file": "09-reserved-vs-actual.png", "section": "4. Who does what", "persona": "Keiko Kowalski", "role": "AMG seat admin", "title": "Track the reservation against actual seats", "narration": "The AMG seat admin opens their LOB. Reserved is what AMG committed to. Assigned counts the people in the AMG tracking group who actually hold a Copilot seat from the shared license group. Over is billed on top, and Unused reserved is paid for but not used.", "url": "/Registry/Seats/11743dda-c8d3-f111-a0e5-6045bd5e8510", "audio": "audio/09.wav", "durationMs": 18290}, {"n": 10, "file": "10-trend.png", "section": "4. Who does what", "persona": "Keiko Kowalski", "role": "AMG seat admin", "title": "Follow the monthly trend and open findings", "narration": "Below, the monthly chart compares reserved and assigned seats from the chargeback snapshots. Open findings for the LOB are listed with them, for example people who are in two LOB tracking groups.", "url": "/Registry/Seats/11743dda-c8d3-f111-a0e5-6045bd5e8510", "audio": "audio/10.wav", "durationMs": 12535}, {"n": 11, "file": "11-ask-increase.png", "section": "4. Who does what", "persona": "Keiko Kowalski", "role": "AMG seat admin", "title": "Ask for more seats at any time", "narration": "To add seats, the seat admin starts a reservation change. The current reservation is filled in by the Workbench, not typed. They enter the new total and who needs the seats. Increases can be asked for at any time.", "url": "/Requests/New/J9?fundingOwner=11743dda-c8d3-f111-a0e5-6045bd5e8510", "audio": "audio/11.wav", "durationMs": 15360}, {"n": 12, "file": "12-intake.png", "section": "4. Who does what", "persona": "Aisha Rahman", "role": "Intake analyst", "title": "Intake checks the request is complete", "narration": "The intake analyst checks the request: the LOB, the new total, and who needs the seats. If something is missing, they return it to the requester; otherwise they mark it complete.", "url": "/Requests/706878f0-c8d3-f111-a0e5-6045bd5e8510", "audio": "audio/12.wav", "durationMs": 12535}, {"n": 13, "file": "13-dw-consult.png", "section": "4. Who does what", "persona": "Diane Moreau", "role": "Platform Owner (Digital Workplace)", "title": "Digital Workplace confirms the seats are available", "narration": "Before Finance can decide, Digital Workplace answers a blocking consult. They confirm unallocated tenant inventory, approved pending demand and the operational buffer. The decision waits for this answer.", "url": "/Requests/706878f0-c8d3-f111-a0e5-6045bd5e8510", "audio": "audio/13.wav", "durationMs": 13935}, {"n": 14, "file": "14-finops-decide.png", "section": "4. Who does what", "persona": "Carlos Mendes", "role": "FinOps lead (Finance)", "title": "Finance decides, with a flex-pool review", "narration": "The FinOps lead decides. The form shows unallocated seats, purchased less reserved, buffer and pending requests. A flex-pool review is required to approve. If the request is above what is unallocated, Finance can still approve it with conditions, and the Workbench notes that a purchase decision is needed.", "url": "/Requests/706878f0-c8d3-f111-a0e5-6045bd5e8510", "audio": "audio/14.wav", "durationMs": 20965}, {"n": 15, "file": "15-history.png", "section": "4. Who does what", "persona": "Carlos Mendes", "role": "FinOps lead (Finance)", "title": "The new reservation is recorded", "narration": "The approved increase becomes AMG's reservation from its effective date. The history keeps the previous and new quantity, the approver, the flex-pool review and the request, as the policy requires.", "url": "/Registry/Seats/11743dda-c8d3-f111-a0e5-6045bd5e8510", "audio": "audio/15.wav", "durationMs": 13485}, {"n": 16, "file": "16-decrease-window.png", "section": "4. Who does what", "persona": "Carlos Mendes", "role": "FinOps lead (Finance)", "title": "Decreases wait for the April true-down window", "narration": "When an LOB asks to give seats back, the request shows the true-down window. Decreases can only be approved from the fifteenth of February, forty-five days before the April EA anniversary, and take effect on the first of April. Until then the reservation does not change, and the LOB keeps paying for it.", "url": "/Requests/098773f7-c8d3-f111-a0e5-6045bd5e8510", "audio": "audio/16.wav", "durationMs": 20025}, {"n": 17, "file": "17-held.png", "section": "4. Who does what", "persona": "Carlos Mendes", "role": "FinOps lead (Finance)", "title": "The decrease is held, and Finance is reminded when the window opens", "narration": "Finance holds the request. Its decision task is due on the day the window opens, so the FinOps lead is reminded then, and Digital Workplace is consulted again because the seat picture may have changed.", "url": "/Requests/098773f7-c8d3-f111-a0e5-6045bd5e8510", "audio": "audio/17.wav", "durationMs": 13330}, {"n": 18, "file": "18-reclaim.png", "section": "4. Who does what", "persona": "Ines Ibarra", "role": "AMG business owner", "title": "Decide on unused seats: keep or reclaim", "narration": "Seats with no Copilot use for sixty days are proposed for reclaim. The AMG business owner answers each one. Keep leaves the seat. Reclaim opens an ITSM task to remove the person's OIM role, Asset Management Group, M365 Copilot License, Role. The proposal closes when the read-back shows the seat is gone.", "url": "/Registry/Seats/11743dda-c8d3-f111-a0e5-6045bd5e8510#reclaim", "audio": "audio/18.wav", "durationMs": 24135}, {"n": 19, "file": "19-findings.png", "section": "4. Who does what", "persona": "Kevin Brooks", "role": "Platform operator", "title": "Operations works the seat findings", "narration": "The platform operator follows up the seat findings: seats no LOB tracking group claims, people in two LOBs, direct assignments outside the license group, license errors such as a missing usage location, leavers still holding a seat, and LOBs over their reservation.", "url": "/Operations/Findings?Type=SEAT_NO_LOB", "audio": "audio/19.wav", "durationMs": 17745}, {"n": 20, "file": "20-chargeback.png", "section": "4. Who does what", "persona": "Carlos Mendes", "role": "FinOps lead (Finance)", "title": "Finance certifies the monthly chargeback", "narration": "Each month the worker takes a draft chargeback. Each LOB pays its full reservation plus any seats above it, at one rate for every LOB. The FinOps lead checks the draft and certifies the month. A certified month never changes; later changes apply from their effective date.", "url": "/Reports/SeatChargeback", "audio": "audio/20.wav", "durationMs": 18570}, {"n": 21, "file": "21-auditor.png", "section": "4. Who does what", "persona": "Ruth Campbell", "role": "Auditor", "title": "Auditors read everything, change nothing", "narration": "Auditors can read the chargeback, the reservation history and the decisions, and export them. Every reservation decision is an append-only ledger row, so the record cannot be edited after the fact.", "url": "/Reports/SeatChargeback", "audio": "audio/21.wav", "durationMs": 12810}];
const SECTION_COLORS = { "1": "var(--s1)", "2": "var(--s2)", "3": "var(--s3)", "4": "var(--s4)" };
const $ = id => document.getElementById(id);
const audio = $("audio");
let i = 0, cues = [], playing = false;

// Subtitle cues: sentences timed by their share of the clip's characters.
function makeCues(s) {
  const parts = s.narration.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g).map(t => t.trim()).filter(Boolean);
  const chunks = [];
  for (const p of parts) {
    if (p.length <= 150) { chunks.push(p); continue; }
    const words = p.split(" "); let cur = "";
    for (const w of words) { if ((cur + " " + w).length > 120 && cur) { chunks.push(cur); cur = w; } else cur = cur ? cur + " " + w : w; }
    if (cur) chunks.push(cur);
  }
  const total = chunks.reduce((a, c) => a + c.length, 0);
  const dur = (s.durationMs || 15000) / 1000;
  let t = 0;
  return chunks.map(c => { const start = t; t += dur * c.length / total; return { start, end: t, text: c }; });
}

function buildNav() {
  let last = "";
  const nav = $("nav");
  SCENES.forEach((s, k) => {
    if (s.section !== last) { const h = document.createElement("h2"); h.textContent = s.section; nav.appendChild(h); last = s.section; }
    const b = document.createElement("button");
    b.innerHTML = `<span class="num">${String(s.n).padStart(2, "0")}</span><span class="t">${s.title}<span class="who">${s.role} · ${s.persona}</span></span>`;
    b.onclick = () => go(k, true);
    nav.appendChild(b);
  });
  $("total").textContent = `${SCENES.length} steps · about ${Math.round(SCENES.reduce((a, s) => a + (s.durationMs || 0), 0) / 60000)} minutes`;
}

function go(k, autoplay) {
  i = Math.max(0, Math.min(SCENES.length - 1, k));
  const s = SCENES[i];
  $("shot").src = "shots/" + s.file;
  $("shot").alt = s.title + " (screen of the Workbench as " + s.role + ")";
  $("section").textContent = s.section;
  $("section").style.background = SECTION_COLORS[s.section[0]] || "var(--accent)";
  $("role").textContent = s.role + " · " + s.persona;
  $("title").textContent = s.title;
  $("narration").textContent = s.narration;
  $("counter").textContent = `Step ${i + 1} of ${SCENES.length}`;
  $("subtitle").textContent = "";
  $("progress").style.width = "0";
  cues = makeCues(s);
  document.querySelectorAll("nav button").forEach((b, k2) => b.setAttribute("aria-current", k2 === i ? "true" : "false"));
  document.querySelectorAll("nav button")[i].scrollIntoView({ block: "nearest" });
  audio.src = s.audio;
  audio.playbackRate = parseFloat($("speed").value);
  if (autoplay) play(); else pause();
}

function play() { audio.play().then(() => { playing = true; $("play").textContent = "Pause"; }).catch(() => {}); }
function pause() { audio.pause(); playing = false; $("play").textContent = "Play"; }

audio.addEventListener("timeupdate", () => {
  const t = audio.currentTime;
  const c = cues.find(c => t >= c.start && t < c.end) || (t > 0 ? cues[cues.length - 1] : null);
  $("subtitle").textContent = $("subs").checked && c ? c.text : "";
  if (audio.duration) $("progress").style.width = (100 * t / audio.duration) + "%";
});
audio.addEventListener("loadedmetadata", () => {
  // Rescale cues to the real clip length.
  const s = SCENES[i]; const real = audio.duration;
  if (real && isFinite(real)) { const k = real / ((s.durationMs || real * 1000) / 1000); cues.forEach(c => { c.start *= k; c.end *= k; }); }
});
audio.addEventListener("ended", () => {
  $("progress").style.width = "100%";
  if ($("auto").checked && i < SCENES.length - 1) setTimeout(() => go(i + 1, true), 900);
  else pause();
});

$("play").onclick = () => playing ? pause() : play();
$("prev").onclick = () => go(i - 1, playing);
$("next").onclick = () => go(i + 1, playing);
$("speed").onchange = () => audio.playbackRate = parseFloat($("speed").value);
$("subs").onchange = () => { if (!$("subs").checked) $("subtitle").textContent = ""; };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "ArrowRight") go(i + 1, playing);
  else if (e.key === "ArrowLeft") go(i - 1, playing);
  else if (e.key.toLowerCase() === "s") { $("subs").checked = !$("subs").checked; $("subs").onchange(); }
});

buildNav();
go(0, false);
</script>
</body>
</html>
